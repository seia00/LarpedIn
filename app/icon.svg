<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LarpLink">
  <!-- Oxblood plate -->
  <rect width="100" height="100" rx="20" fill="#5A121E"/>
  <!-- Antique-brass keyline -->
  <rect x="7.5" y="7.5" width="85" height="85" rx="13" fill="none" stroke="#A98A50" stroke-width="2" opacity="0.7"/>
  <!-- LL monogram, cream serif -->
  <text x="50" y="53" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', 'Cormorant Garamond', serif"
        font-size="52" font-weight="600" letter-spacing="-3" fill="#EBDDC8">LL</text>
</svg>
